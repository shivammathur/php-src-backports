name: Sync workflow
on:
  workflow_dispatch:
    inputs:
      php-versions:
        description: 'PHP version to build'
        default: '5.6 7.0 7.1 7.2 7.3 7.4 8.0 8.1'
        required: true
      upstream:
        type: choice
        description: Upstream php-src repository
        options:
        - remicollet/php-src-security
        - oerdnj/php-src-security
        - microsoft/php-src
        default: remicollet/php-src-security
        required: true
      run_build:
        type: choice
        description: Trigger workflow_dispatch for shivammathur/php tap
        options:
        - 'true'
        - 'false'
        default: 'true'
        required: true
jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || github.token }}
      - name: Update tags and branches
        env:
          UPSTREAM: ${{ inputs.upstream }}
          PHP_VERSIONS: ${{ inputs.php-versions }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add up "https://github.com/$UPSTREAM"
          patch_dir="$RUNNER_TEMP/patches"
          cp -R patches "$patch_dir"

          selected_versions=" ${PHP_VERSIONS//,/ } "
          mapfile -t branches < <(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/PHP-*')
          mapfile -t tags < <(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          declare -A release_branches
          refs=()
          leases=()
          for branch in "${branches[@]}"; do
            version=${branch#PHP-}
            version=${version%%-*}
            [[ $selected_versions == *" $version "* ]] || continue
            source_branch=$branch
            if [[ $UPSTREAM == remicollet/php-src-security && $version == 5.6 ]]; then
              source_branch=PHP-5.6-security-backports-openssl11
            fi
            upstream_ref="refs/remotes/up/$source_branch"
            if ! git show-ref --verify --quiet "$upstream_ref"; then
              git fetch --no-tags up "refs/heads/$source_branch:$upstream_ref"
            fi
            git checkout -B "$branch" "$upstream_ref"
            for list in "$version" "$branch" "$UPSTREAM/$version" "$UPSTREAM/$branch"; do
              [[ -f $patch_dir/$list ]] || continue
              while IFS= read -r patch; do
                git am --keep-cr --committer-date-is-author-date "$patch_dir/$patch"
              done < "$patch_dir/$list"
            done
            ref="refs/heads/$branch"
            refs+=("$ref:$ref")
            leases+=("--force-with-lease=$ref:$(git rev-parse "refs/remotes/origin/$branch")")
            if [[ $version != 5.6 || $branch == PHP-5.6-security-backports-openssl11 ]]; then
              release_branches[$version]=$branch
            fi
          done

          if (( ${#refs[@]} == 0 )); then
            echo "No branches matched PHP versions: $PHP_VERSIONS" >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            version=${tag%.*}
            [[ $selected_versions == *" $version "* ]] || continue
            branch=${release_branches[$version]}
            ref="refs/tags/$tag"
            leases+=("--force-with-lease=$ref:$(git rev-parse "$ref")")
            GIT_COMMITTER_DATE="$(git log -1 --format=%cI "$branch")" git tag -fa "$tag" "$branch" -m "Update $tag tag"
            refs+=("$ref:$ref")
          done
          git push --atomic "${leases[@]}" origin "${refs[@]}"
      - name: Trigger Homebrew build
        if: inputs.run_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: gh workflow run build.yml -R shivammathur/homebrew-php
